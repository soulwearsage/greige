<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREIGE — NEWS BOARD</title>
<style>
  :root{
    --bg: #ffffff;
    --fg: #111111;
    --fg-muted: #767676;
    --border: #e6e6e6;
    --accent: #111111;
    --select: #111111;
    --keep: #8a7a4a;
    --reject: #b9483f;
    --img-check: #2563eb;
  }
  *{ box-sizing: border-box; }
  [hidden]{ display: none !important; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  header{
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .wordmark{
    text-align: center;
    padding: 28px 16px 18px;
  }
  .wordmark .brand{
    font-size: 22px;
    letter-spacing: 0.42em;
    font-weight: 300;
    text-transform: uppercase;
  }
  .wordmark .brand b{ font-weight: 500; }
  .wordmark .tagline{
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--fg-muted);
    text-transform: uppercase;
  }

  .toolbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 16px 14px;
  }
  .date-nav{
    display: flex;
    gap: 18px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .date-nav::-webkit-scrollbar{ display:none; }
  .date-nav button{
    flex: 0 0 auto;
    background: none;
    border: none;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    padding: 6px 0;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .date-nav button.active{ color: var(--fg); border-bottom: 1px solid var(--fg); }

  .category-nav{
    display: flex;
    gap: 16px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .category-nav::-webkit-scrollbar{ display:none; }
  .category-nav button{
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    text-transform: uppercase;
  }
  .category-nav button.active{ color: var(--bg); background: var(--fg); border-color: var(--fg); }

  .status-banner{
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--fg-muted);
    text-align: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }

  main{ padding: 20px 16px 80px; }

  .grid{
    display: grid;
    gap: 28px 16px;
    grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 600px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px){ .grid{ grid-template-columns: repeat(4, 1fr); } }

  .card{ cursor: pointer; }
  .card .thumb{
    width: 100%;
    aspect-ratio: 3 / 2;
    background: #f4f4f4;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .card .thumb .noimg{ color:#c9c9c9; font-size:10px; letter-spacing:0.12em; }
  .card .meta{ padding-top: 10px; }
  .card .source{
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .card .title{
    font-size: 12px;
    margin-top: 4px;
    line-height: 1.5;
    font-weight: 400;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .date{ font-size: 11px; margin-top: 4px; color: var(--fg-muted); }
  .card .status-badge{
    display: inline-block;
    margin-top: 5px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid var(--border);
    color: var(--fg-muted);
  }
  .card.status-SELECTED .status-badge{ border-color: var(--select); color: var(--select); }
  .card.status-KEEP .status-badge{ border-color: var(--keep); color: var(--keep); }
  .card.status-REJECT .status-badge{ border-color: var(--reject); color: var(--reject); opacity: 0.5; }
  .card.status-REJECT{ opacity: 0.35; }

  .empty{ text-align:center; color:var(--fg-muted); font-size:13px; padding:80px 0; letter-spacing:0.04em; }

  /* ── RIGHT DRAWER ── */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    z-index: 100;
  }
  .overlay.open{ display: block; }
  .sheet{
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 100%;
    max-width: 520px;
    background: var(--bg);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 101;
  }
  .overlay.open .sheet{ transform: translateX(0); }

  .sheet-close{
    position: sticky; top: 0;
    display: flex; justify-content: flex-end;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .sheet-close button{
    background: none; border: none; font-size: 20px; cursor: pointer; color: var(--fg); font-family: inherit;
  }

  .sheet-panel{ padding: 20px 24px 40px; }

  /* Article detail panel */
  #panel-detail .article-img{
    width: 100%;
    aspect-ratio: 16/9;
    background: #f4f4f4;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  #panel-detail .article-img img{ width:100%; height:100%; object-fit:cover; }

  .detail-source{ font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); }
  .detail-title{ font-size: 17px; margin: 6px 0 4px; font-weight: 400; line-height: 1.5; }
  .detail-date{ font-size: 13px; color: var(--fg-muted); margin-bottom: 16px; }

  .field-row{
    display: flex; justify-content: space-between; gap: 16px;
    padding: 9px 0;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
  }
  .field-row .k{ color: var(--fg-muted); flex: 0 0 90px; }
  .field-row .v{ text-align: right; flex: 1; word-break: break-word; }
  .field-row .v a{ text-decoration: underline; }

  .article-summary{
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--fg-muted);
  }
  .article-summary .k{
    display:block; color: var(--fg); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 6px;
  }

  .actions{
    display: flex; gap: 8px; margin-top: 26px;
  }
  .actions button{
    flex: 1;
    padding: 13px 0;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    font-size: 12px;
    letter-spacing: 0.1em;
    cursor: pointer;
    font-family: inherit;
    text-transform: uppercase;
  }
  .actions button.btn-select{ background: var(--fg); color: var(--bg); }
  .actions button.btn-keep{ border-color: var(--keep); color: var(--keep); }
  .actions button.btn-reject{ border-color: var(--reject); color: var(--reject); }
  .actions button:disabled{ opacity: 0.4; cursor: default; }

  .current-status{ margin-top: 14px; font-size: 11px; letter-spacing: 0.08em; color: var(--fg-muted); text-align: center; }

  /* Image picker panel */
  #panel-images .panel-title{
    font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px;
  }
  #panel-images .panel-sub{ font-size: 12px; color: var(--fg-muted); margin-bottom: 20px; }

  .img-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .img-item{
    position: relative;
    cursor: pointer;
  }
  .img-item img{
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }
  .img-item.checked img{ border-color: var(--img-check); }
  .img-item .check-mark{
    position: absolute;
    top: 6px; right: 6px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    transition: all 0.15s;
  }
  .img-item.checked .check-mark{
    background: var(--img-check);
    border-color: var(--img-check);
    color: white;
  }
  .img-item .check-mark::after{ content: '✓'; display: none; }
  .img-item.checked .check-mark::after{ display: block; }

  .no-images{ text-align: center; color: var(--fg-muted); font-size: 13px; padding: 30px 0; }

  .btn-save{
    width: 100%;
    padding: 14px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .btn-save:disabled{ opacity: 0.4; cursor: default; }
  .btn-back{
    width: 100%;
    padding: 10px;
    background: none;
    border: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    color: var(--fg-muted);
  }

  .save-result{
    margin-top: 14px;
    font-size: 12px;
    color: var(--fg-muted);
    text-align: center;
    line-height: 1.7;
  }

  .spinner{
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--fg);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <div class="brand">greige <b>news</b></div>
    <div class="tagline">News Curation Board</div>
  </div>
  <div class="toolbar">
    <div class="date-nav" id="dateNav"></div>
  </div>
  <div class="category-nav" id="categoryNav"></div>
  <div class="status-banner" id="statusBanner">読み込み中…</div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" hidden>表示する記事がありません</div>
</main>

<!-- Right drawer overlay -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-close"><button onclick="closeDrawer()">×</button></div>

    <!-- Panel 1: Article detail + actions -->
    <div class="sheet-panel" id="panel-detail">
      <div class="article-img" id="detailImg">
        <span class="noimg" style="color:#c9c9c9;font-size:10px;letter-spacing:.12em">NO IMAGE</span>
      </div>
      <div class="detail-source" id="detailSource"></div>
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-date" id="detailDate"></div>
      <div class="field-row">
        <span class="k">カテゴリ</span>
        <span class="v" id="detailCategory">—</span>
      </div>
      <div class="field-row">
        <span class="k">キーワード</span>
        <span class="v" id="detailKeyword">—</span>
      </div>
      <div class="field-row">
        <span class="k">元記事</span>
        <span class="v" id="detailLink">—</span>
      </div>
      <div class="article-summary" id="detailSummary" hidden>
        <span class="k">Summary</span>
        <span id="detailSummaryText"></span>
      </div>
      <div class="actions">
        <button class="btn-select" onclick="handleAction('SELECT')">Select</button>
        <button class="btn-keep"   onclick="handleAction('KEEP')">Keep</button>
        <button class="btn-reject" onclick="handleAction('REJECT')">Reject</button>
      </div>
      <div class="current-status" id="currentStatus"></div>
    </div>

    <!-- Panel 2: Image picker -->
    <div class="sheet-panel" id="panel-images" hidden>
      <div class="panel-title">画像を選択</div>
      <div class="panel-sub" id="imgPanelSub">記事内の画像にチェックを入れて保存してください</div>
      <div class="img-grid" id="imgGrid"></div>
      <div class="no-images" id="noImages" hidden>画像が見つかりません</div>
      <button class="btn-save" id="btnSave" onclick="saveImages()">選択した画像を保存する</button>
      <button class="btn-back" onclick="showDetailPanel()">← 記事詳細に戻る</button>
      <div class="save-result" id="saveResult"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
var cfg = window.NEWS_BOARD_CONFIG || {};
var API = cfg.API_BASE_URL || '';
var TOKEN = cfg.API_TOKEN || '';
var allArticles = [];
var filteredArticles = [];
var currentDateFilter = 'ALL';
var currentCategoryFilter = 'ALL';
var openArticle = null;
var imgChecked = {}; // url → bool

// ── Demo data (used when no API configured) ────────────────────────────────
var DEMO_DATA = [
  { news_id: 'demo-1', source_name: 'PR TIMES', source_url: 'https://prtimes.jp', title: 'デモ記事：APIを設定するとここに実際の記事が表示されます', news_date: '2026-10-04', category: 'FASHION', matched_keyword: 'demo', image_url: '', summary: 'config.js の API_BASE_URL に GAS Web App の URL を設定してください。', status: 'NEW' },
  { news_id: 'demo-2', source_name: 'AT PRESS', source_url: 'https://atpress.ne.jp', title: 'デモ記事 2：ニュースカードのサンプルです', news_date: '2026-10-04', category: 'LIFESTYLE', matched_keyword: 'demo', image_url: '', summary: 'SELECT → 画像選択 → Google Drive 保存の流れをテストできます。', status: 'NEW' },
  { news_id: 'demo-3', source_name: 'PR TIMES', source_url: 'https://prtimes.jp', title: 'デモ記事 3：すでにKEEP済みのカード', news_date: '2026-10-03', category: 'WELLBEING', matched_keyword: 'wellness', image_url: '', summary: '', status: 'KEEP' },
];

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  loadArticles();
});

function loadArticles() {
  setBanner('読み込み中…');
  if (!API) {
    allArticles = DEMO_DATA;
    renderAll();
    return;
  }
  fetch(API + '?action=listNews&token=' + encodeURIComponent(TOKEN))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.error) throw new Error(data.error);
      allArticles = data.articles || [];
      renderAll();
    })
    .catch(function(e){
      setBanner('エラー: ' + e.message);
    });
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderAll() {
  buildDateNav();
  buildCategoryNav();
  applyFilters();
}

function buildDateNav() {
  var dates = {};
  allArticles.forEach(function(a){ var d = (a.news_date||'').slice(0,10); if(d) dates[d]=true; });
  var sorted = Object.keys(dates).sort().reverse();
  var nav = document.getElementById('dateNav');
  nav.innerHTML = '';
  var all = btn('ALL', function(){ setDateFilter('ALL'); });
  if (currentDateFilter==='ALL') all.classList.add('active');
  nav.appendChild(all);
  sorted.forEach(function(d){
    var b = btn(d, function(){ setDateFilter(d); });
    if (currentDateFilter===d) b.classList.add('active');
    nav.appendChild(b);
  });
}

function buildCategoryNav() {
  var cats = {};
  allArticles.forEach(function(a){ var c = (a.category||'').toUpperCase(); if(c) cats[c]=true; });
  var sorted = Object.keys(cats).sort();
  var nav = document.getElementById('categoryNav');
  nav.innerHTML = '';
  var all = btn('ALL', function(){ setCategoryFilter('ALL'); });
  if (currentCategoryFilter==='ALL') all.classList.add('active');
  nav.appendChild(all);
  sorted.forEach(function(c){
    var b = btn(c, function(){ setCategoryFilter(c); });
    if (currentCategoryFilter===c) b.classList.add('active');
    nav.appendChild(b);
  });
}

function btn(label, onclick) {
  var b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', onclick);
  return b;
}

function setDateFilter(d) { currentDateFilter = d; renderAll(); }
function setCategoryFilter(c) { currentCategoryFilter = c; renderAll(); }

function applyFilters() {
  filteredArticles = allArticles.filter(function(a){
    if (currentDateFilter !== 'ALL' && (a.news_date||'').slice(0,10) !== currentDateFilter) return false;
    if (currentCategoryFilter !== 'ALL' && (a.category||'').toUpperCase() !== currentCategoryFilter) return false;
    return true;
  });
  renderGrid();
  var total = allArticles.length;
  var showing = filteredArticles.length;
  var selected = allArticles.filter(function(a){ return a.status==='SELECTED'; }).length;
  setBanner(total + '件 | 表示中 ' + showing + '件 | 選択済み ' + selected + '件');
}

function renderGrid() {
  var grid = document.getElementById('grid');
  var empty = document.getElementById('emptyMsg');
  grid.innerHTML = '';
  if (!filteredArticles.length) {
    empty.hidden = false;
    return;
  }
  empty.hidden = true;
  filteredArticles.forEach(function(a){
    var card = document.createElement('div');
    card.className = 'card status-' + (a.status||'NEW');
    card.dataset.id = a.news_id;
    card.addEventListener('click', function(){ openDetail(a); });

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (a.image_url) {
      var img = document.createElement('img');
      img.src = a.image_url;
      img.alt = '';
      img.onerror = function(){ this.style.display='none'; };
      thumb.appendChild(img);
    } else {
      var ni = document.createElement('span');
      ni.className = 'noimg';
      ni.textContent = 'NO IMAGE';
      thumb.appendChild(ni);
    }

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML =
      '<div class="source">' + esc(a.source_name||'') + '</div>' +
      '<div class="title">' + esc(a.title||'') + '</div>' +
      '<div class="date">' + esc((a.news_date||'').slice(0,10)) + '</div>' +
      '<div class="status-badge">' + esc(a.status||'NEW') + '</div>';

    card.appendChild(thumb);
    card.appendChild(meta);
    grid.appendChild(card);
  });
}

function setBanner(t) { document.getElementById('statusBanner').textContent = t; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Detail Drawer ──────────────────────────────────────────────────────────
function openDetail(article) {
  openArticle = article;
  imgChecked = {};
  showDetailPanel();

  var di = document.getElementById('detailImg');
  if (article.image_url) {
    di.innerHTML = '<img src="' + esc(article.image_url) + '" alt="">';
  } else {
    di.innerHTML = '<span style="color:#c9c9c9;font-size:10px;letter-spacing:.12em">NO IMAGE</span>';
  }
  document.getElementById('detailSource').textContent = article.source_name || '';
  document.getElementById('detailTitle').textContent = article.title || '';
  document.getElementById('detailDate').textContent = (article.news_date||'').slice(0,10);
  document.getElementById('detailCategory').textContent = article.category || '—';
  document.getElementById('detailKeyword').textContent = article.matched_keyword || '—';

  var linkEl = document.getElementById('detailLink');
  if (article.source_url) {
    linkEl.innerHTML = '<a href="' + esc(article.source_url) + '" target="_blank" rel="noopener">開く ↗</a>';
  } else {
    linkEl.textContent = '—';
  }

  var sumWrap = document.getElementById('detailSummary');
  if (article.summary) {
    document.getElementById('detailSummaryText').textContent = article.summary;
    sumWrap.hidden = false;
  } else {
    sumWrap.hidden = true;
  }

  document.getElementById('currentStatus').textContent = 'Status: ' + (article.status || 'NEW');

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  openArticle = null;
}

document.getElementById('overlay').addEventListener('click', function(e){
  if (e.target === this) closeDrawer();
});

function showDetailPanel() {
  document.getElementById('panel-detail').hidden = false;
  document.getElementById('panel-images').hidden = true;
}

function showImagesPanel() {
  document.getElementById('panel-detail').hidden = true;
  document.getElementById('panel-images').hidden = false;
}

// ── Actions ────────────────────────────────────────────────────────────────
function handleAction(action) {
  if (!openArticle) return;
  if (action === 'SELECT') {
    // Update status optimistically then show image picker
    updateArticleStatus(openArticle.news_id, 'SELECTED', function(ok){
      if (ok) {
        openArticle.status = 'SELECTED';
        updateCardStatus(openArticle.news_id, 'SELECTED');
        applyFilters();
      }
      loadArticleImages(openArticle);
    });
  } else {
    updateArticleStatus(openArticle.news_id, action, function(ok){
      if (ok) {
        openArticle.status = action;
        updateCardStatus(openArticle.news_id, action);
        document.getElementById('currentStatus').textContent = 'Status: ' + action;
        applyFilters();
        if (action === 'REJECT') {
          setTimeout(closeDrawer, 600);
        }
      }
    });
  }
}

function updateArticleStatus(newsId, status, cb) {
  if (!API) {
    // Demo mode: just succeed
    cb(true);
    return;
  }
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'updateStatus', token: TOKEN, news_id: newsId, status: status }),
  })
    .then(function(r){ return r.json(); })
    .then(function(d){ cb(!d.error); })
    .catch(function(){ cb(false); });
}

function updateCardStatus(newsId, status) {
  var card = document.querySelector('.card[data-id="' + newsId + '"]');
  if (!card) return;
  card.className = 'card status-' + status;
  var badge = card.querySelector('.status-badge');
  if (badge) badge.textContent = status;
}

// ── Image Picker ───────────────────────────────────────────────────────────
function loadArticleImages(article) {
  document.getElementById('imgPanelSub').textContent = '画像を取得中…';
  document.getElementById('imgGrid').innerHTML = '';
  document.getElementById('noImages').hidden = true;
  document.getElementById('saveResult').textContent = '';
  document.getElementById('btnSave').disabled = true;
  showImagesPanel();

  if (!API) {
    // Demo: show placeholder images
    renderImages([
      'https://placehold.co/400x300/f4f4f4/999?text=Image+1',
      'https://placehold.co/400x300/f4f4f4/999?text=Image+2',
      'https://placehold.co/400x300/f4f4f4/999?text=Image+3',
    ]);
    return;
  }

  fetch(API + '?action=fetchImages&token=' + encodeURIComponent(TOKEN) + '&news_id=' + encodeURIComponent(article.news_id) + '&url=' + encodeURIComponent(article.source_url||''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      renderImages(d.images || []);
    })
    .catch(function(e){
      document.getElementById('imgPanelSub').textContent = 'エラー: ' + e.message;
    });
}

function renderImages(urls) {
  var grid = document.getElementById('imgGrid');
  grid.innerHTML = '';
  document.getElementById('imgPanelSub').textContent = urls.length + '枚の画像が見つかりました。保存する画像を選んでください。';

  if (!urls.length) {
    document.getElementById('noImages').hidden = false;
    document.getElementById('btnSave').disabled = true;
    return;
  }

  imgChecked = {};
  urls.forEach(function(url){
    imgChecked[url] = false;
    var item = document.createElement('div');
    item.className = 'img-item';
    item.dataset.url = url;
    item.innerHTML =
      '<img src="' + esc(url) + '" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'">' +
      '<div class="check-mark"></div>';
    item.addEventListener('click', function(){
      imgChecked[url] = !imgChecked[url];
      item.classList.toggle('checked', imgChecked[url]);
      updateSaveBtn();
    });
    grid.appendChild(item);
  });
  updateSaveBtn();
}

function updateSaveBtn() {
  var any = Object.values(imgChecked).some(Boolean);
  document.getElementById('btnSave').disabled = !any;
}

// ── Save to Drive ──────────────────────────────────────────────────────────
function saveImages() {
  if (!openArticle) return;
  var selected = Object.keys(imgChecked).filter(function(k){ return imgChecked[k]; });
  if (!selected.length) return;

  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 保存中...';
  document.getElementById('saveResult').textContent = '';

  if (!API) {
    // Demo mode
    setTimeout(function(){
      btn.innerHTML = '選択した画像を保存する';
      document.getElementById('saveResult').textContent = 'デモモード: ' + selected.length + '枚の画像を保存しました（実際には保存されていません）\nAPIを設定すると Google Drive に保存されます。';
      setTimeout(closeDrawer, 2000);
    }, 1200);
    return;
  }

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'saveImages',
      token: TOKEN,
      news_id: openArticle.news_id,
      title: openArticle.title,
      news_date: openArticle.news_date,
      image_urls: selected,
    }),
  })
    .then(function(r){ return r.json(); })
    .then(function(d){
      btn.innerHTML = '選択した画像を保存する';
      if (d.error) {
        document.getElementById('saveResult').textContent = 'エラー: ' + d.error;
        btn.disabled = false;
        return;
      }
      document.getElementById('saveResult').textContent =
        '✓ ' + (d.saved||0) + '枚を Google Drive に保存しました\n📁 ' + (d.folder_path||'');
      // Write back drive URLs if returned
      if (d.drive_urls && d.drive_urls.length) {
        openArticle.drive_image_urls = d.drive_urls;
      }
      setTimeout(closeDrawer, 2500);
    })
    .catch(function(e){
      btn.innerHTML = '選択した画像を保存する';
      btn.disabled = false;
      document.getElementById('saveResult').textContent = 'エラー: ' + e.message;
    });
}
</script>
